<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Products | Commerce OS</title><link rel="stylesheet" href="styles.css"/></head>
<body><header class="site-header shell"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>commerce<span class="brand-muted">.os</span></span></a><nav aria-label="Dashboard navigation"><a href="storefront.html">View store</a><a class="active" href="catalog.html">Products</a><a href="dashboard.html">Orders</a><a href="pricing.html">Plan</a></nav><a class="button button-dark button-small" href="dashboard.html">Dashboard</a></header><main class="shell admin-main"><div class="admin-welcome"><div><p class="eyebrow">Catalog</p><h1>Products</h1><p>Update your products and stock. Changes appear in the demo storefront.</p></div></div><section class="admin-panel product-editor"><h2 id="product-form-title">Add a product</h2><form id="product-form" class="product-form"><input type="hidden" id="product-id"/><label>Product name<input id="product-name" required maxlength="70" placeholder="For example, everyday tote"/></label><label>Price in ₹<input id="product-price" type="number" min="1" step="1" required value="1299"/></label><label>Category<input id="product-category" maxlength="32" value="Featured"/></label><label>Stock quantity<input id="product-stock" type="number" min="0" step="1" required value="12"/></label><button class="button button-dark" type="submit" id="save-product">Add to catalog</button><button class="text-link" type="button" id="cancel-edit" hidden>Cancel edit</button></form></section><section class="admin-panel"><div class="panel-title"><div><h2>Your catalog</h2><p id="catalog-summary"></p></div><a class="text-link" href="storefront.html">See the storefront →</a></div><div class="catalog-list" id="catalog-list"></div></section></main><footer class="site-footer shell"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>commerce<span class="brand-muted">.os</span></span></a><span>Commerce OS merchant dashboard demo</span></footer><script src="commerce.js"></script></body></html>
